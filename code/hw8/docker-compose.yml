name: hw8

services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: s7838_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot job that creates every topic with the Kafka CLI, then exits.
  kafka-init:
    image: apache/kafka:3.9.2
    container_name: s7838_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$T --create --if-not-exists --topic s7838_entity_requests --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s7838_entity_responses --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s7838_inbox --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s7838_tasks --partitions 2 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s7838_drafts --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s7838_final --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s7838_dead_letter --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --list --bootstrap-server $$B

  worker:
    build: .
    container_name: s7838_worker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "worker.consumer"]
    restart: unless-stopped

  api:
    build: .
    container_name: s7838_api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8638:8638"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONUNBUFFERED: "1"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8638"]
    restart: unless-stopped
