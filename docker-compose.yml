services:
  mongodb:
    image: mongo:7.0
    container_name: data260_hw6_mongodb
    ports:
      - "27017:27017"
    volumes:
      - hw6_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hw6_mongodb_data:
