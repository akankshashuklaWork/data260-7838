<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a rental housing listing.">
  <title>HW1-Akanksha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Rental Housing Listing</h1>
    <p class="intro">Browse and manage rental listings. All fields are required when adding or updating a listing.</p>

    <section class="toolbar" aria-labelledby="searchHeading">
      <h2 id="searchHeading">Find a listing</h2>
      <form id="searchForm" class="search-form">
        <label for="searchInput">Search by title or location</label>
        <div class="search-controls">
          <input id="searchInput" type="search" placeholder="e.g., San Jose or Willow Glen">
          <button type="submit">Search</button>
          <button type="button" id="clearSearch" class="secondary-button">Clear</button>
        </div>
      </form>
    </section>

    <form id="rentalListingForm">
      <label for="propertyTitle">Property title *</label>
      <input
        type="text"
        id="propertyTitle"
        name="propertyTitle"
        placeholder="e.g., Sunny two-bedroom near downtown"
        autofocus
        required
      >

      <label for="propertyLocation">Property location *</label>
      <input
        type="text"
        id="propertyLocation"
        name="propertyLocation"
        placeholder="e.g., 123 Market St, San Jose, CA"
        required
      >

      <label for="submitterEmail">Submitter email *</label>
      <input
        type="email"
        id="submitterEmail"
        name="submitterEmail"
        placeholder="e.g., owner@example.com"
        required
      >

      <label for="propertyDescription">Property description *</label>
      <textarea
        id="propertyDescription"
        name="propertyDescription"
        rows="5"
        placeholder="Describe the rooms, amenities, rent, and nearby attractions (more than 25 characters)."
        required
      ></textarea>
      <p id="characterCount" class="help-text" aria-live="polite">0 characters</p>

      <label for="propertyCategory">Property category *</label>
      <select id="propertyCategory" name="propertyCategory" required>
        <option value="" selected disabled>Select a category</option>
        <option value="Apartment">Apartment</option>
        <option value="House">House</option>
        <option value="Condo">Condo</option>
        <option value="Townhouse">Townhouse</option>
      </select>

      <div class="terms-row">
        <input type="checkbox" id="termsAccepted" name="termsAccepted" value="agreed">
        <label for="termsAccepted">I agree to the terms and conditions.</label>
      </div>

      <div class="form-actions">
        <button type="submit">Add Rental Listing</button>
        <button type="button" id="updateListing" class="secondary-button">Update Listing ID 1</button>
      </div>
      <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    </form>

    <section aria-labelledby="submissionsHeading">
      <h2 id="submissionsHeading">Successful submissions</h2>
      <p id="loadingState" class="loading-state" role="status" aria-live="polite">Loading listings…</p>
      <p id="errorState" class="error-state" role="alert" hidden>We could not load the listings. Please try again.</p>
      <ul id="listingSubmissions" hidden>
        <li id="emptyState" class="empty-state">No listings match your search.</li>
      </ul>
      <button type="button" id="deleteHighest" class="danger-button">Delete Highest-ID Listing</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
