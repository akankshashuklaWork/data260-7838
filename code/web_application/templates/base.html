<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rental housing listing authentication portal">
  <title>{% block title %}Rental Housing Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/auth.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">Rental Housing Portal</a>
      <div class="d-flex align-items-center gap-2">
        {% if user %}
          <a class="btn btn-sm btn-outline-light" href="/dashboard">Dashboard</a>
          <a class="btn btn-sm btn-light" href="/logout">Log out</a>
        {% else %}
          <a class="btn btn-sm btn-light" href="/login">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
